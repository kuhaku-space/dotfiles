[settings]
# バージョン・URL・チェックサムを mise.lock に記録する。
# 版指定は "latest" のままでよく、実際に入る版は lock が決めるので他のマシンでも
# 同じ構成が再現する（チェックサム検証も付く）。
# lock はグローバル設定にも作れる: `mise lock --global`（-g を付けないと
# プロジェクトの config root しか見ないので "No tools configured to lock" になる）。
# 更新は `mise upgrade`（.zshrc の update 関数が lock の取り込みまで面倒を見る）。
lockfile = true

[hooks]
# ツールが入った／上がった直後に zsh 補完を作り直す。
#
# これが無いと補完の再生成は run_onchange_after_40 の内容ハッシュでしか起きず、
# `mise upgrade` したあと「実行ファイルは新しいのに補完は古い」状態が次にその
# スクリプトを編集するまで残る。バージョンマネージャとシェル補完の間に空く隙間を、
# mise 側のフックで閉じる。
#
# postinstall は実際に何かが入ったときだけ発火する（更新が無ければ走らない）ので、
# 無駄打ちしない。スクリプト側も版が変わっていなければ約20msで抜ける。
# フックのコマンドが無い場合は mise が WARN を出すだけで install は成功する。
postinstall = "~/.local/bin/refresh-zsh-completions"

[tools]
bat = "latest"
deno = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
glow = "latest"
hyperfine = "latest"
neovim = "latest"
starship = "latest"
chezmoi = "latest"
zoxide = "latest"
claude = "latest"
usage = "latest"
jujutsu = "latest"
sheldon = "latest"
zellij = "latest"
bitwarden = "latest"  # aqua:bitwarden/clients。公式ネイティブバイナリ（node 不要）で、
                      # run_once_before_01 が先行導入するものと同一
# CI と同じ lint をローカルでも回せるようにする（.github/workflows/ci-cd.yml 参照）
shellcheck = "latest"
actionlint = "latest"

# rust と node と typst は意図的にここに置かない。版を固定したいのがプロジェクト側
# なので、各リポジトリの mise 設定（または rustup）に任せる。
#
# rust: mise の core:rust は rustup を検出すると installs/rust を
#   $CARGO_HOME/bin への symlink にするだけで、実体は rustup が管理する。
#   その上で RUSTUP_TOOLCHAIN を export するため、rustup の選択順で最強のこれが
#   プロジェクトの rust-toolchain.toml を黙って上書きしてしまう。
#   lock にも url/checksum が入らず（symlink なので記録するものが無い）、
#   このファイル冒頭の再現性の話も rust には効いていなかった。
# node: dotfiles 側に node 依存は無い（bw は aqua のネイティブバイナリ、
#   claude は aqua:anthropics/claude-code、nvim の設定は未管理）。
# typst: 2度足して2度外している（a1bbe35 → 800e007、および後の再発）。足したくなる
#   動機は毎回「zsh 補完が欲しい」だが、補完のためにグローバルへ版を固定するのは
#   関係が逆立ちしている。文書のビルドはプロジェクトごとに版を決めたいので、ここに
#   置くと 800e007 で避けたはずの「グローバルの版がプロジェクトより強い」状態に戻る。
#   補完だけなら ~/.local/bin/refresh-zsh-completions が面倒を見る。あれは
#   `mise ls --installed` を見るので、プロジェクトの mise.toml で入れた typst でも
#   補完を生成し、どこにも入っていなければ生成しない。ここに書く必要はない。
