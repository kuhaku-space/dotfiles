[settings]
lockfile = true

[hooks]
postinstall = "~/.local/bin/refresh-zsh-completions"

[tool_alias]
bitwarden = "github:bitwarden/clients"
claude = "github:anthropics/claude-code"

[tools]
actionlint = "latest"
atuin = "latest"
bat = "latest"
bitwarden = { version = "latest", version_prefix = "cli-v" }
carapace = "latest"
chezmoi = "latest"
claude = "latest"
deno = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
glow = "latest"
hyperfine = "latest"
neovim = "latest"
ripgrep = "latest"
sheldon = "latest"
shellcheck = "latest"
starship = "latest"
usage = "latest"
zellij = "latest"
zoxide = "latest"
