[settings]
# バージョン・URL・チェックサムを mise.lock に記録する。
# 版指定は "latest" のままでよく、実際に入る版は lock が決めるので他のマシンでも
# 同じ構成が再現する（チェックサム検証も付く）。
# lock はグローバル設定にも作れる: `mise lock --global`（-g を付けないと
# プロジェクトの config root しか見ないので "No tools configured to lock" になる）。
# 更新は `mise upgrade`（.zshrc の update 関数が lock の取り込みまで面倒を見る）。
lockfile = true

[tools]
bat = "latest"
deno = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
glow = "latest"
hyperfine = "latest"
neovim = "latest"
rust = "latest"  # 1.x のみなので "latest" が実質メジャー固定
starship = "latest"
chezmoi = "latest"
zoxide = "latest"
claude = "latest"
usage = "latest"
node = "26"
jujutsu = "latest"
sheldon = "latest"
zellij = "latest"
"npm:@bitwarden/cli" = "latest"
# CI と同じ lint をローカルでも回せるようにする（.github/workflows/ci-cd.yml 参照）
shellcheck = "latest"
actionlint = "latest"
