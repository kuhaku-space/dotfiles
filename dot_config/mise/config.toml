[settings]
# バージョン・URL・チェックサムを mise.lock に記録する。
# 版指定は "latest" のままでよく、実際に入る版は lock が決めるので他のマシンでも
# 同じ構成が再現する（チェックサム検証も付く）。
# lock はグローバル設定にも作れる: `mise lock --global`（-g を付けないと
# プロジェクトの config root しか見ないので "No tools configured to lock" になる）。
# 更新は `mise upgrade`（.zshrc の update 関数が lock の取り込みまで面倒を見る）。
lockfile = true

[tools]
bat = "latest"
deno = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
glow = "latest"
hyperfine = "latest"
neovim = "latest"
starship = "latest"
chezmoi = "latest"
zoxide = "latest"
claude = "latest"
usage = "latest"
jujutsu = "latest"
sheldon = "latest"
typst = "latest"
zellij = "latest"
bitwarden = "latest"  # aqua:bitwarden/clients。公式ネイティブバイナリ（node 不要）で、
                      # run_once_before_01 が先行導入するものと同一
# CI と同じ lint をローカルでも回せるようにする（.github/workflows/ci-cd.yml 参照）
shellcheck = "latest"
actionlint = "latest"

# rust と node は意図的にここに置かない。言語ランタイムは版を固定したいのが
# プロジェクト側なので、各リポジトリの mise 設定（または rustup）に任せる。
#
# rust: mise の core:rust は rustup を検出すると installs/rust を
#   $CARGO_HOME/bin への symlink にするだけで、実体は rustup が管理する。
#   その上で RUSTUP_TOOLCHAIN を export するため、rustup の選択順で最強のこれが
#   プロジェクトの rust-toolchain.toml を黙って上書きしてしまう。
#   lock にも url/checksum が入らず（symlink なので記録するものが無い）、
#   このファイル冒頭の再現性の話も rust には効いていなかった。
# node: dotfiles 側に node 依存は無い（bw は aqua のネイティブバイナリ、
#   claude は aqua:anthropics/claude-code、nvim の設定は未管理）。
