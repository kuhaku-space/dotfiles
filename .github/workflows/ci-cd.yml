name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dotfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Lint shell scripts
        run: |
          mapfile -t scripts < <(find . -type f \( -name '*.sh' -o -name '*.sh.tmpl' \) | sort)
          if ((${#scripts[@]})); then
            shellcheck -e SC1091 "${scripts[@]}"
          fi

          tmp="$(mktemp)"
          chezmoi execute-template <run_onchange_after_30-mise-install.sh.tmpl >"$tmp"
          bash -n "$tmp"

      - name: Validate chezmoi templates
        run: |
          chezmoi execute-template <.chezmoiignore >/dev/null
          chezmoi execute-template <.chezmoi.toml.tmpl >/dev/null
          chezmoi execute-template <run_onchange_after_30-mise-install.sh.tmpl >/dev/null

      - name: Validate TOML
        run: |
          python3 -c '
          from pathlib import Path
          import subprocess
          import tomllib

          for path in sorted(Path(".").rglob("*.toml")):
              with path.open("rb") as f:
                  tomllib.load(f)

          rendered = Path("/tmp/chezmoi.toml")
          rendered.write_bytes(
              subprocess.check_output(
                  ["chezmoi", "execute-template"],
                  input=Path(".chezmoi.toml.tmpl").read_bytes(),
              )
          )
          with rendered.open("rb") as f:
              tomllib.load(f)
          '

      - name: Validate YAML
        run: yamllint -d relaxed dot_config/zeno/config.yml .github/workflows/ci-cd.yml
