name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dotfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install validation tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint zsh
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          gh release download --repo rhysd/actionlint \
            --pattern '*_linux_amd64.tar.gz' --dir "$tmp"
          tar -xzf "$tmp"/*_linux_amd64.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Lint shell scripts
        run: |
          mapfile -t scripts < <(
            find . -path ./.git -prune -o -type f \
              \( -name '*.sh' -o -name '*.sh.tmpl' -o -path './dot_local/bin/*' \) \
              -print | sort
          )
          if ((${#scripts[@]})); then
            shellcheck -e SC1091 "${scripts[@]}"
          fi
          shellcheck -e SC1091 .githooks/*

          mapfile -t templates < <(
            find . -path ./.git -prune -o -type f -name '*.sh.tmpl' -print | sort
          )
          for template in "${templates[@]}"; do
            tmp="$(mktemp)"
            chezmoi --source . execute-template <"$template" >"$tmp"
            bash -n "$tmp" || {
              printf 'rendered %s failed bash -n\n' "$template"
              exit 1
            }
            rm -f "$tmp"
          done

      - name: Lint zsh files
        run: |
          zsh -n dot_zshenv
          zsh -n dot_config/zsh/dot_zshenv
          zsh -n dot_config/zsh/dot_zshrc
          python3 -c '
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("dot_config/sheldon/plugins.toml").read_text())
          failed = False
          for name, plugin in config.get("plugins", {}).items():
              code = plugin.get("inline")
              if not code:
                  continue
              result = subprocess.run(
                  ["zsh", "-n"], input=code, text=True, capture_output=True
              )
              if result.returncode != 0:
                  failed = True
                  print(f"inline plugin {name}: {result.stderr}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          '

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Scan for secrets
        run: |
          bash scripts/check-secrets.sh --tracked
          bash scripts/check-secrets.sh --history

      - name: Validate chezmoi templates
        run: |
          chezmoi --source . execute-template <.chezmoiignore >/dev/null
          while IFS= read -r template; do
            chezmoi --source . execute-template <"$template" >/dev/null || {
              printf 'failed to render %s\n' "$template"
              exit 1
            }
          done < <(
            find . -path ./.git -prune -o -path ./private_dot_ssh -prune -o \
              -type f -name '*.tmpl' -print | sort
          )
          CI=true chezmoi --source . execute-template <.chezmoiignore |
            grep -qx '.ssh/id_ed25519'

          for key_state in broken empty valid-but-different; do
            fake_home="$(mktemp -d)"
            mkdir -p "$fake_home/.ssh"
            case "$key_state" in
              broken) printf 'not a key\n' >"$fake_home/.ssh/id_ed25519" ;;
              empty) : >"$fake_home/.ssh/id_ed25519" ;;
              valid-but-different)
                ssh-keygen -q -t ed25519 -N '' -C ci \
                  -f "$fake_home/.ssh/id_ed25519"
                ;;
            esac
            env -u CI HOME="$fake_home" \
              chezmoi --source "$PWD" execute-template <.chezmoiignore >/dev/null ||
              {
                printf 'template evaluation failed for key state: %s\n' "$key_state"
                exit 1
              }
            rm -rf "$fake_home"
          done

          for platform in linux-x64 linux-arm64; do
            grep -q "^\[tools.bitwarden.\"platforms.$platform\"\]" \
              dot_config/mise/private_mise.lock || {
              printf 'no bitwarden entry for %s in the lockfile\n' "$platform"
              exit 1
            }
          done

      - name: Validate TOML
        run: |
          python3 -c '
          from pathlib import Path
          import subprocess
          import tomllib

          paths = sorted(Path(".").rglob("*.toml"))
          paths += sorted(Path(".").rglob("*mise.lock"))
          for path in paths:
              with path.open("rb") as f:
                  tomllib.load(f)

          rendered = Path("/tmp/chezmoi.toml")
          rendered.write_bytes(
              subprocess.check_output(
                  ["chezmoi", "--source", ".", "execute-template"],
                  input=Path(".chezmoi.toml.tmpl").read_bytes(),
              )
          )
          with rendered.open("rb") as f:
              tomllib.load(f)
          '

      - name: Validate git config
        run: |
          git config --file dot_config/git/config --list >/dev/null
          chezmoi --source . execute-template \
            <dot_config/git/allowed_signers.tmpl >/tmp/allowed_signers
          test -s /tmp/allowed_signers
          grep -vE '^\s*(#|$)' /tmp/allowed_signers | while read -r principal keytype key _; do
            test -n "$principal" && test -n "$keytype" && test -n "$key"
            printf '%s %s\n' "$keytype" "$key" >/tmp/signer.pub
            ssh-keygen -lf /tmp/signer.pub >/dev/null
          done

      - name: Validate YAML
        run: |
          yamllint -d relaxed \
            dot_config/zeno/config.yml \
            .github/workflows/ci-cd.yml

  bootstrap:
    name: Bootstrap on clean Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run chezmoi init --apply in a clean container
        run: |
          docker run --rm -e CI=true -v "$PWD:/src:ro" ubuntu:24.04 \
            bash -euxo pipefail -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                curl ca-certificates git sudo locales >/dev/null

              cp -a /src /root/dotfiles
              chown -R root:root /root/dotfiles
              cd /root

              sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /root/.local/bin \
                init --apply --source /root/dotfiles

              test -f /root/.zshenv
              grep -q "ZDOTDIR" /root/.zshenv
              test -f /root/.config/zsh/.zshrc
              test -f /root/.config/git/allowed_signers
              test -f /root/.ssh/known_hosts.chezmoi
              test -f /root/.config/jj/config.toml
              test ! -e /root/.ssh/id_ed25519
              test ! -e /root/bin/chezmoi
              getent passwd root | grep -q "zsh$"
              origin_url="$(git -C /root/dotfiles remote get-url origin)"
              test "$origin_url" = "ssh://git@github.com/kuhaku-space/dotfiles.git" || {
                printf "origin is %s\n" "$origin_url"
                exit 1
              }
              test "$(git -C /root/dotfiles config core.hooksPath)" = /root/dotfiles/.githooks

              export PATH="/root/.local/share/mise/shims:/root/.local/bin:$PATH"
              timeout 300 zsh -ic "print -r -- BOOTSTRAP_OK" | grep -q BOOTSTRAP_OK

              test -s /root/.local/share/zsh/completions/_mise
              test -s /root/.cache/zsh/starship-init.zsh

              test -f /root/.config/mise/mise.lock
              bash /root/dotfiles/scripts/check-mise-lock.sh \
                sheldon starship zoxide fzf deno bat eza usage
            '
